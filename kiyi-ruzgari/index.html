<title>Kıyı Rüzgârı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --panel: rgba(17, 44, 60, 0.93);
    --panel-solid: #16384b;
    --panel-2: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.11);
    --ink: #f3f1e8;
    --muted: #a9c3cc;
    --buoy: #ff8a5b;
    --buoy-deep: #d9623a;
    --foam: #9be3dc;
    --sand: #f3d9a4;
    --gold: #ffcf4a;
    --danger: #ff7a6b;
    --sea: #1f5f86;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--sea); color: var(--ink);
    font-family: var(--body); font-size: 14px; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--buoy); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #sea.dragging { cursor: grabbing; }

  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
  }
  #hud > * { pointer-events: auto; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; font-weight: 800; font-size: 15px;
    box-shadow: 0 4px 14px rgba(5, 25, 40, 0.3);
  }
  .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .coin { background: radial-gradient(circle at 35% 30%, #ffe595, #e7a72a 70%, #b97a12); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .ico svg { width: 14px; height: 14px; }
  .fuel { width: 64px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
  .fuel i { display: block; height: 100%; border-radius: 4px; background: var(--foam); }
  .fuel.low i { background: var(--danger); }

  .clock {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px 9px;
    min-width: 210px; box-shadow: 0 4px 14px rgba(5, 25, 40, 0.3);
  }
  .clock .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .clock b { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1; }
  .clock small { color: var(--muted); font-weight: 800; }
  .clock .w { margin-top: 3px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .clock .w.storm { color: var(--danger); }

  .goal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px;
    max-width: 270px; font-size: 13px; box-shadow: 0 4px 14px rgba(5, 25, 40, 0.3);
  }
  .goal .lbl { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--foam); font-weight: 900; }
  .goal .rw { color: var(--gold); font-weight: 900; white-space: nowrap; }

  .tools { display: flex; gap: 8px; }
  .rbtn {
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center;
    background: var(--buoy); color: #fff; font-weight: 900; font-size: 14px; box-shadow: 0 4px 12px rgba(5,25,40,.3);
    background-image: linear-gradient(90deg, transparent 38%, rgba(255,255,255,.9) 38%, rgba(255,255,255,.9) 62%, transparent 62%);
    transition: transform .12s;
  }
  .rbtn span { background: var(--buoy); border-radius: 8px; padding: 1px 3px; line-height: 1; display: grid; place-items: center; }
  .rbtn svg { width: 17px; height: 17px; }
  .rbtn:hover { transform: rotate(-8deg); }
  .rbtn:active { transform: scale(.93); }
  .rbtn.on span { background: var(--sea); }

  /* bottom bar */
  #bar {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(560px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px;
    box-shadow: 0 12px 34px rgba(5, 25, 40, 0.45);
  }
  .barrow { display: flex; gap: 10px; align-items: center; }
  .barrow .grow { flex: 1; min-width: 0; }
  .where { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.15; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .meter { position: relative; height: 22px; border-radius: 11px; background: rgba(0,0,0,.3); margin-top: 10px; overflow: hidden; border: 1px solid var(--line); }
  .meter .g { position: absolute; top: 0; bottom: 0; background: rgba(155, 227, 220, .45); }
  .meter .a { position: absolute; top: 0; bottom: 0; background: var(--gold); }
  .meter .n { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 6px rgba(0,0,0,.5); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid var(--line); font-size: 12px; font-weight: 800;
  }
  button.chip.on { background: var(--foam); color: #0f3340; border-color: transparent; }
  button.chip:disabled { opacity: .45; cursor: not-allowed; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px;
    border-radius: 12px; border: none; background: var(--buoy); color: #fff; font-weight: 900; font-size: 13px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .1s, filter .1s; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px); }
  .btn.big { min-height: 52px; min-width: 132px; font-size: 16px; font-family: var(--display); font-weight: 600; border-radius: 16px; }
  .btn.pull { background: var(--gold); color: #3a2a05; animation: pulse .5s ease-in-out infinite alternate; }
  .btn.foam { background: var(--foam); color: #0f3340; }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .btn.warn { background: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; animation: none; }
  .btn .coin { width: 14px; height: 14px; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

  #log {
    position: fixed; z-index: 4; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
    display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: 300px;
  }
  .li { background: rgba(12, 34, 48, .78); border-radius: 10px; padding: 5px 10px; font-size: 12px; font-weight: 700; display: flex; gap: 7px; align-items: center; animation: tin .25s ease both; }
  .li svg { width: 26px; height: 14px; flex: none; }

  /* modal */
  #modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(6, 22, 34, .55); }
  .mcard {
    width: min(620px, 100%); max-height: min(86vh, 760px); overflow: auto; background: var(--panel-solid);
    border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .shead h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.1; flex: 1; text-wrap: balance; }
  .x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 19px; line-height: 1; flex: none; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
  .tabs { display: flex; gap: 6px; margin: 6px 0 12px; flex-wrap: wrap; }
  .tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 900; font-size: 13px; }
  .tab.on { background: var(--buoy); color: #fff; border-color: transparent; }
  .rowline { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .rowline:first-of-type { border-top: none; }
  .rowline .grow { flex: 1; min-width: 0; }
  .rowline .t { font-weight: 900; }
  .rowline .d { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .rowline svg.fish { width: 46px; height: 24px; flex: none; }
  .lvl { font-size: 11px; font-weight: 900; color: var(--foam); letter-spacing: .5px; }
  .price { font-weight: 900; color: var(--gold); white-space: nowrap; }
  .note { font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.2); line-height: 1.4; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .rar0 { color: #cfd8dc; } .rar1 { color: #6fc3ff; } .rar2 { color: #c79bff; } .rar3 { color: var(--gold); }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
  .dcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .dcard svg { width: 100%; height: 38px; }
  .dcard .t { font-weight: 900; font-size: 13px; }
  .dcard .d { font-size: 11px; color: var(--muted); }
  .dcard.unk { opacity: .55; }
  .zhead { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--foam); font-weight: 900; margin: 14px 0 6px; }

  #toasts {
    position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 120px);
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: calc(100% - 32px);
  }
  .toast {
    background: rgba(12, 34, 48, .95); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px;
    font-weight: 800; font-size: 13px; max-width: 440px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,.3); animation: tin .25s ease both;
  }
  .toast.good { border-color: rgba(155, 227, 220, .55); }
  .toast.bad { border-color: rgba(255, 122, 107, .65); }
  .toast.gold { border-color: var(--gold); color: var(--gold); }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    .clock { min-width: 0; }
    .goal { max-width: 220px; }
    #log { display: none; }
    #toasts { top: calc(env(safe-area-inset-top, 0px) + 150px); }
  }
  @media (max-width: 460px) {
    .hideS { display: none !important; }
    .btn.big { min-width: 108px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.pull { animation: none; }
    .toast, .li { animation: none; }
  }
</style>

/* ============================================================
   Hex math
   ============================================================ */
const SQ3 = Math.sqrt(3);
const HS = 40, TILT = 0.6, DEPTH = 12, MAPR = 14;
const key = (q, r) => q + ',' + r;
const h2w = (q, r) => ({ x: HS * SQ3 * (q + r / 2), y: HS * 1.5 * r * TILT });
function hexRound(q, r) {
  let x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return { q: rx, r: rz };
}
const w2h = (x, y) => { const yy = y / TILT; return hexRound((SQ3 / 3 * x - yy / 3) / HS, (2 / 3 * yy) / HS); };
const hd = (a, b) => { const dq = a.q - b.q, dr = a.r - b.r; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; };
const NB = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const CORNERS = [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 30); return [Math.cos(a) * HS, Math.sin(a) * HS * TILT]; });
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.floor(n).toLocaleString('tr-TR');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ============================================================
   Map (deterministic, not saved)
   ============================================================ */
const T = {};
const PORTS = [{ id: 'main', q: 0, r: 0, name: 'Martı Limanı', full: true }, { id: 'fener', q: -9, r: 4, name: 'Fener Adası', full: false }];
let WRECKS = [], BOTTLES = [], LEGENDS = {};
function zoneOf(q, r) {
  const d = hd({ q, r }, { q: 0, r: 0 }), x = SQ3 * (q + r / 2), y = 1.5 * r;
  if (d <= 4) return 'koy';
  if (d <= 9) return x > 0 ? 'resif' : 'acik';
  return y < 0 ? 'buzul' : 'derin';
}
function buildMap() {
  const rng = mulberry(2026);
  for (let q = -MAPR; q <= MAPR; q++) for (let r = -MAPR; r <= MAPR; r++) {
    const d = hd({ q, r }, { q: 0, r: 0 });
    if (d > MAPR) continue;
    T[key(q, r)] = { q, r, d, z: zoneOf(q, r), land: false, port: null, v: Math.floor(rng() * 3), deco: null };
  }
  const land = (q, r, deco) => { const t = T[key(q, r)]; if (t) { t.land = true; t.deco = deco; } };
  // home island
  land(-1, 0, 'houses'); land(0, -1, 'market'); land(-1, 1, 'palm'); land(-2, 1, 'grass');
  T[key(0, 0)].port = 'main'; T[key(0, 0)].land = true;
  // lighthouse island
  land(-10, 4, 'lighthouse'); land(-9, 3, 'palm');
  T[key(-9, 4)].port = 'fener'; T[key(-9, 4)].land = true;
  const busy = t => t.land || NB.some(([a, b]) => T[key(t.q + a, t.r + b)]?.land);
  const free = (minD, maxD, zone) => {
    for (let i = 0; i < 400; i++) {
      const q = Math.floor(rng() * (MAPR * 2 + 1)) - MAPR, r = Math.floor(rng() * (MAPR * 2 + 1)) - MAPR, t = T[key(q, r)];
      if (!t || t.d < minD || t.d > maxD || busy(t) || (zone && t.z !== zone)) continue;
      if (WRECKS.concat(BOTTLES).some(o => o.q === q && o.r === r) || Object.values(LEGENDS).some(o => o.q === q && o.r === r)) continue;
      return t;
    }
    return null;
  };
  // islands
  for (let i = 0; i < 9; i++) {
    const t = free(5, MAPR - 1); if (!t) continue;
    const ice = t.z === 'buzul';
    land(t.q, t.r, ice ? 'ice' : rng() < 0.6 ? 'palm' : 'rock');
    if (rng() < 0.5) { const [a, b] = NB[Math.floor(rng() * 6)]; const o = T[key(t.q + a, t.r + b)]; if (o && !o.port && o.d > 4) land(o.q, o.r, ice ? 'ice' : 'rock'); }
  }
  for (const z of ZORDER) { const t = free(z === 'koy' ? 3 : 6, MAPR, z); if (t) LEGENDS[z] = { q: t.q, r: t.r, z }; }
  for (let i = 0; i < 7; i++) { const t = free(3, MAPR); if (t) WRECKS.push({ id: i, q: t.q, r: t.r }); }
  const bz = ['koy', 'resif', 'acik', 'buzul', 'derin'];
  for (let i = 0; i < 5; i++) { const t = free(2, MAPR, i === 0 ? 'koy' : i === 1 ? 'resif' : 'acik'); if (t) BOTTLES.push({ id: i, q: t.q, r: t.r, leg: bz[i] }); }
}
buildMap();
const tileAt = (q, r) => T[key(q, r)];
const portAt = (q, r) => PORTS.find(p => p.q === q && p.r === r);

function newGame() {

    dex: {}, aqua: {}, market: {}, demand: {}, day: 1,

function serialize() { return JSON.stringify(S); }
function save() { try { localStorage.setItem(SAVE_KEY, serialize()); } catch (e) { /* storage unavailable */ } }
function load(raw) {

}

/* ============================================================
   Derived

const boatDef = () => BOATS[S.boat - 1];
const holdCap = () => boatDef().hold;
const fuelCap = () => boatDef().fuel;
const revealR = () => 2 + S.gear.binoc;
const freshDur = () => [DAY, DAY * 2, DAY * 4, DAY * 8][S.gear.cooler];
const dayPhase = () => (S.t % DAY) / DAY;
const hour = () => (dayPhase() * 24 + 6) % 24;
function darkness() { const h = hour(); if (h >= 20.5 || h < 4.5) return 1; if (h < 6.5) return 1 - (h - 4.5) / 2; if (h >= 18.5) return (h - 18.5) / 2; return 0; }
const isNight = () => darkness() > 0.6;
const seasonIdx = () => Math.floor((S.day - 1) / 3) % 4;
const docked = () => !B.moving && portAt(S.pos.q, S.pos.r);
function freshness(it) { return clamp(1 - (S.t - it.t) / freshDur(), 0, 1); }
function itemValue(it) {
  const f = FISH[it.sp], sz = (it.cm - f.cm[0]) / Math.max(1, f.cm[1] - f.cm[0]);
  return f.p * (0.75 + 0.5 * sz) * S.market[it.sp] * S.demand[it.sp] * (0.35 + 0.65 * freshness(it)) * (seasonIdx() === 3 ? 1.15 : 1);
}
const holdValue = () => S.hold.reduce((s, it) => s + itemValue(it), 0);
function canAfford(c) { return S.coins >= c; }
function spend(c) { if (S.coins < c) { toast('Yeterli altının yok', 'bad'); return false; } S.coins -= c; return true; }
function rollMarket() { FKEYS.forEach(k => { S.market[k] = FISH[k].legend ? 1 : +(0.8 + Math.random() * 0.5).toFixed(2); }); }
function rollCands() {
  S.cands = [0, 1, 2].map(() => {
    const trait = pick(Object.keys(TRAITS));
    return { name: pick(NAMES.filter(n => !S.crew.some(c => c.name === n))), trait, hat: Math.floor(Math.random() * HATS.length), fee: Math.round(80 + S.crew.length * 60 + Math.random() * 40) };
  });
  S.candDay = S.day;
}
function reveal(q, r, rad) {
  for (let dq = -rad; dq <= rad; dq++) for (let dr = -rad; dr <= rad; dr++) {
    if (Math.abs(dq + dr) > rad) continue;
    const t = tileAt(q + dq, r + dr); if (!t) continue;
    if (!S.seen[key(t.q, t.r)]) {
      S.seen[key(t.q, t.r)] = 1;
      if (!t.land && !S.zonesSeen[t.z]) { S.zonesSeen[t.z] = true; toast(`Yeni bölge keşfedildi: ${ZONES[t.z].name}. ${ZONES[t.z].desc}`, 'good'); }
    }
  }
}

/* ============================================================
   Boat runtime
   ============================================================ */
const B = { x: 0, y: 0, path: [], moving: false, face: 1, wake: [], tow: 0 };
const dockPos = (q, r) => { const p = h2w(q, r); return { x: p.x + 20, y: p.y + 8 }; };
function placeBoat() { const p = portAt(S.pos.q, S.pos.r) ? dockPos(S.pos.q, S.pos.r) : h2w(S.pos.q, S.pos.r); B.x = p.x; B.y = p.y; }

function passable(t) { return t && (!t.land || t.port) && ZONES[t.z].boat <= S.boat; }
function findPath(from, to) {
  const start = key(from.q, from.r), goal = key(to.q, to.r);
  const prev = { [start]: null }, queue = [from];
  while (queue.length) {
    const c = queue.shift(), ck = key(c.q, c.r);
    if (ck === goal) break;
    for (const [a, b] of NB) {
      const n = tileAt(c.q + a, c.r + b); if (!n) continue;
      const nk = key(n.q, n.r);
      if (nk in prev || !passable(n)) continue;
      // ports are only entered as a destination
      if (n.port && nk !== goal) continue;
      prev[nk] = ck; queue.push({ q: n.q, r: n.r });
    }
  }
  if (!(goal in prev)) return null;
  const out = []; let k = goal;
  while (k) { const [q, r] = k.split(',').map(Number); out.unshift({ q, r }); k = prev[k]; }
  return out;
}
function goTo(q, r, quiet) {
  const t = tileAt(q, r);
  if (!t) return;
  if (t.land && !t.port) { if (!quiet) toast('Tekne karaya çıkamaz'); return; }
  if (ZONES[t.z].boat > S.boat) { toast(`${ZONES[t.z].name} için ${BOATS[ZONES[t.z].boat - 1].n} gerekir`, 'bad'); return; }
  const from = B.moving && B.path.length ? B.path[0] : S.pos;
  const p = findPath(from, { q, r });
  if (!p) { toast('Oraya giden bir rota yok'); return; }
  B.path = B.moving && B.path.length ? [B.path[0], ...p.slice(1)] : p.slice(1);
  if (!B.path.length) return;
  B.moving = true;
  cancelPlayerCast();
  if (portAt(S.pos.q, S.pos.r) && !B.leftPort) { B.leftPort = true; }
  closeModal();
}
function nearestPortPath() {
  let best = null;
  for (const p of PORTS) { const path = findPath(S.pos, p); if (path && (!best || path.length < best.length)) best = path; }
  return best;
}

function arrive(t) {
  S.pos = { q: t.q, r: t.r };
  const storm = S.weather.k === 'storm';
  const port = portAt(t.q, t.r);
  if (!port) S.fuel = Math.max(0, S.fuel - (storm ? 2 : 1));
  reveal(t.q, t.r, revealR());
  const w = WRECKS.find(o => o.q === t.q && o.r === t.r);
  if (w && !S.wrecks.includes(w.id)) {
    S.wrecks.push(w.id);
    const loot = Math.round(60 + tileAt(w.q, w.r).d * 22 + Math.random() * 80);
    S.coins += loot; floatText(B.x, B.y - 40, `+${loot} altın`, '#ffcf4a');
    toast(`Batık gemide bir sandık buldun: +${loot} altın!`, 'gold');
  }
  const b = BOTTLES.find(o => o.q === t.q && o.r === t.r);
  if (b && !S.bottles.includes(b.id)) {
    S.bottles.push(b.id);
    const L = LEGENDS[b.leg];
    if (L) { S.legSeen[b.leg] = true; reveal(L.q, L.r, 1); }
    toast(`Şişede bir harita var! ${FISH['L_' + b.leg].n} ${ZONES[b.leg].name} içinde işaretlendi.`, 'gold');
  }
  for (const z in LEGENDS) { const L = LEGENDS[z]; if (hd(L, t) <= revealR()) S.legSeen[z] = true; }
  if (port) { dock(port); return; }
  if (S.fuel <= 0) tow();
}
function dock(port) {
  B.path = []; B.moving = false;
  const need = fuelCap() - S.fuel;
  if (need > 0) {
    const buy = Math.min(need, Math.floor(S.coins / 2));
    if (buy > 0) { S.coins -= buy * 2; S.fuel += buy; }
    if (buy < need) toast(`Yakıt için yeterli altın yok (${fmt(need - buy)} birim eksik).`, 'bad');
  }
  B.leftPort = false;
  const p = dockPos(port.q, port.r); B.x = p.x; B.y = p.y;
  toast(`${port.name}'na yanaştın. Depo dolduruldu.`, 'good');
  if (S.hold.length) openModal('market');
}
function tow() {
  const fee = Math.min(S.coins, 30 + hd(S.pos, { q: 0, r: 0 }) * 8);
  S.coins -= fee;
  B.path = []; B.moving = false; B.tow = 1.2;
  S.pos = { q: 0, r: 0 }; S.fuel = 0;
  toast(`Yakıtın bitti! Kıyı güvenliği seni Martı Limanı'na çekti (${fmt(fee)} altın).`, 'bad');
  setTimeout(() => { placeBoat(); dock(PORTS[0]); }, 50);
}

function updateBoat(dt) {
  if (B.tow > 0) B.tow -= dt;
  if (!B.moving || !B.path.length) { B.moving = false; return; }
  const next = B.path[0], port = portAt(next.q, next.r);
  const tp = port ? dockPos(next.q, next.r) : h2w(next.q, next.r);
  const dx = tp.x - B.x, dy = tp.y - B.y, d = Math.hypot(dx, dy);
  const sp = 58 * boatDef().spd * (S.weather.k === 'storm' ? 0.75 : 1);
  if (Math.abs(dx) > 1) B.face = dx < 0 ? -1 : 1;
  if (Math.random() < dt * 14) B.wake.push({ x: B.x - B.face * 16, y: B.y + 4, t: 0 });
  if (d <= sp * dt) {
    B.x = tp.x; B.y = tp.y; B.path.shift();
    arrive(tileAt(next.q, next.r));
    if (!B.path.length) B.moving = false;
  } else { B.x += dx / d * sp * dt; B.y += dy / d * sp * dt; }
}

/* ============================================================
   Fishing
   ============================================================ */
const crewRT = [];
function schoolHere() { return S.schools.find(s => s.q === S.pos.q && s.r === S.pos.r); }
const zoneHere = () => tileAt(S.pos.q, S.pos.r).z;
const atLegend = () => { const z = zoneHere(), L = LEGENDS[z]; return L && L.q === S.pos.q && L.r === S.pos.r && !S.dex['L_' + z] ? z : null; };
const canFish = () => !B.moving && !docked() && S.weather.k !== 'storm' && B.tow <= 0;

function rollCatch(o = {}) {
  const z = zoneHere(), night = isNight(), si = seasonIdx(), rain = S.weather.k === 'rain';
  const sc = schoolHere();
  if (sc && Math.random() < 0.6 && !o.player) return sc.sp;
  let w = [100, 22, 4];
  w[1] *= 1 + 0.25 * (S.rod - 1); w[2] *= 1 + 0.4 * (S.rod - 1);
  const bait = S.baitSel;
  if (bait === 'shrimp') { w[1] *= 1.6; w[2] *= 1.4; }
  if (bait === 'glow') { w[1] *= 1.3; w[2] *= 2.5; }
  if (o.perfect) { w[0] *= 0.4; w[2] *= 2; }
  if (o.trait === 'sabir') { w[1] *= 1.3; w[2] *= 1.3; }
  if (o.trait === 'sans') w[2] *= 2;
  let x = Math.random() * (w[0] + w[1] + w[2]), rar = x < w[0] ? 0 : x < w[0] + w[1] ? 1 : 2;
  const nightOk = night && (S.gear.lamp || bait === 'glow' || o.player);
  for (; rar >= 0; rar--) {
    const cands = FKEYS.filter(k => { const f = FISH[k]; return f.z === z && f.r === rar && !f.legend && (!f.night || nightOk); });
    if (!cands.length) continue;
    const ws = cands.map(k => { const f = FISH[k]; let v = 1; if (rain && f.rain) v *= f.rain; if (f.season != null) v *= f.season === si ? 3 : 0.35; if (f.night) v *= 2; return v; });
    let y = Math.random() * ws.reduce((a, b) => a + b, 0);
    for (let i = 0; i < cands.length; i++) { y -= ws[i]; if (y <= 0) return cands[i]; }
    return cands[cands.length - 1];
  }
  return FKEYS.find(k => FISH[k].z === z);
}
function sizeOf(sp, perfect) {
  const f = FISH[sp]; let u = Math.pow(Math.random(), perfect ? 0.8 : 1.7);
  return Math.round(f.cm[0] + (f.cm[1] - f.cm[0]) * u);
}
let fullWarned = 0;
function addCatch(sp, who, from, perfect) {
  if (S.hold.length >= holdCap()) {
    if (S.t - fullWarned > 20) { fullWarned = S.t; toast('Ambar dolu! Balıkları satmak için limana dön.', 'bad'); }

function updateCrew(dt) {
  while (crewRT.length < S.crew.length) crewRT.push({ st: 'idle', t: Math.random() * 2, bob: 0 });
  crewRT.length = S.crew.length;
  const ok = canFish(), sc = schoolHere();

const W2S = (wx, wy) => ({ x: (wx - cam.x) * cam.zoom + W / 2, y: (wy - cam.y) * cam.zoom + H / 2 });
const S2W = (sx, sy) => ({ x: (sx - W / 2) / cam.zoom + cam.x, y: (sy - H / 2) / cam.zoom + cam.y });

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.max(W, H));
  bg.addColorStop(0, '#2a78a8'); bg.addColorStop(1, '#154a6e');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2 - cam.x * cam.zoom, H / 2 - cam.y * cam.zoom);
  ctx.scale(cam.zoom, cam.zoom);
  const tl = S2W(-80, -80), br = S2W(W + 80, H + 120);
  const vis = t => { const p = h2w(t.q, t.r); return p.x > tl.x && p.x < br.x && p.y > tl.y && p.y < br.y; };
  const tiles = TL.filter(vis);
  for (const t of tiles) { const p = h2w(t.q, t.r); drawWaterTile(t, p.x, p.y); }
  // path
  if (B.path.length) {
    ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(B.x, B.y);
    for (const s of B.path) { const port = portAt(s.q, s.r), p = port ? dockPos(s.q, s.r) : h2w(s.q, s.r); ctx.lineTo(p.x, p.y); }
    ctx.stroke(); ctx.setLineDash([]);
    const e = B.path[B.path.length - 1], ep = h2w(e.q, e.r);
    hexPath(ep.x, ep.y, 0.9); ctx.strokeStyle = '#ff8a5b'; ctx.lineWidth = 2.5; ctx.stroke();
  }
  // wake
  for (const w of B.wake) { const a = 1 - w.t / 1.4; ctx.strokeStyle = `rgba(255,255,255,${0.6 * a})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(w.x, w.y, 4 + w.t * 12, (4 + w.t * 12) * 0.35, 0, 0, 7); ctx.stroke(); }

  const items = [];
  const deepHidden = z => z === 'derin' && !S.gear.sonar;
  for (const t of tiles) {
    const p = h2w(t.q, t.r), seen = S.seen[key(t.q, t.r)];
    if (!seen) continue;
    if (t.land) items.push({ y: p.y - 1, f: () => { drawLandTile(t, p.x, p.y); if (t.port) drawPier(t, p.x, p.y); drawDecoTile(t, p.x, p.y); } });
  }
  for (const s of S.schools) { const t = tileAt(s.q, s.r), p = h2w(s.q, s.r); if (S.seen[key(s.q, s.r)] && !deepHidden(t.z) && vis(t)) items.push({ y: p.y - 5, f: () => drawSchool(s, p.x, p.y) }); }
  for (const w of WRECKS) { if (S.wrecks.includes(w.id) || !S.seen[key(w.q, w.r)]) continue; const p = h2w(w.q, w.r); items.push({ y: p.y, f: () => drawWreck(p.x, p.y) }); }
  for (const b of BOTTLES) { if (S.bottles.includes(b.id) || !S.seen[key(b.q, b.r)]) continue; const p = h2w(b.q, b.r); items.push({ y: p.y, f: () => drawBottle(p.x, p.y) }); }
  for (const z in LEGENDS) { const L = LEGENDS[z]; if (!S.legSeen[z] || S.dex['L_' + z] || !S.seen[key(L.q, L.r)]) continue; const p = h2w(L.q, L.r); items.push({ y: p.y - 6, f: () => drawLegend(p.x, p.y) }); }
  items.push({ y: B.y, f: drawBoat });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();

  // fog
  for (const t of tiles) if (!S.seen[key(t.q, t.r)]) { const p = h2w(t.q, t.r); drawFog(t, p.x, p.y); }
  // sonar pings through fog
  if (S.gear.sonar) for (const s of S.schools) { if (S.seen[key(s.q, s.r)] || hd(s, S.pos) > 5) continue; const p = h2w(s.q, s.r); drawSchool(s, p.x, p.y, true); }

  // jumps and floaters
  for (const j of jumps) {
    const k = Math.min(1, j.t / 0.7), x = j.x0 + (j.x1 - j.x0) * k, y = j.y0 + (j.y1 - j.y0) * k - Math.sin(k * Math.PI) * 30;
    drawFishShape(ctx, x, y, 14, j.sp, j.x1 < j.x0 ? -1 : 1, now * 0.03);
  }
  ctx.textAlign = 'center';
  for (const f of floaters) { ctx.globalAlpha = Math.max(0, 1 - f.t / 1.8); ctx.font = '900 13px Nunito, sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,30,45,.7)'; ctx.strokeText(f.text, f.x, f.y - f.t * 22); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - f.t * 22); }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawSky();
  drawLabels();
}

function drawSky() {
  const dk = darkness(), h = hour();
  if (dk > 0.01) {
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, dark.width, dark.height);
    dctx.fillStyle = `rgba(8, 18, 48, ${0.62 * dk})`; dctx.fillRect(0, 0, dark.width, dark.height);
    dctx.globalCompositeOperation = 'destination-out';
    const hole = (wx, wy, r) => { const s = W2S(wx, wy); const g = dctx.createRadialGradient(s.x * DPR, s.y * DPR, 0, s.x * DPR, s.y * DPR, r * cam.zoom * DPR); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g; dctx.fillRect(0, 0, dark.width, dark.height); };
    hole(B.x, B.y, S.gear.lamp ? 150 : 60);
    for (const p of PORTS) { const w = h2w(p.q, p.r); hole(w.x + 20, w.y, 110); }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  if ((h > 17.5 && h < 20) || (h > 4.5 && h < 7)) { const a = 0.14 * (1 - Math.abs(((h > 12 ? h - 18.75 : h - 5.75)) / 1.25)); if (a > 0) { ctx.fillStyle = `rgba(255, 140, 80, ${a})`; ctx.fillRect(0, 0, W, H); } }
  const w = S.weather;
  if (w.k === 'rain' || w.k === 'storm') {
    ctx.fillStyle = w.k === 'storm' ? 'rgba(20,30,50,.28)' : 'rgba(30,50,70,.12)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(210,230,245,.5)'; ctx.lineWidth = 1.2; ctx.beginPath();
    const n = w.k === 'storm' ? 220 : 110, sl = w.k === 'storm' ? 8 : 3;
    for (let i = 0; i < n; i++) { const x = ((i * 97.3 + now * 0.4) % (W + 40)) - 20, y = ((i * 57.7 + now * 1.0) % (H + 40)) - 20; ctx.moveTo(x, y); ctx.lineTo(x - sl, y + 12); }
    ctx.stroke();
    if (w.k === 'storm' && Math.sin(now * 0.0017) > 0.995) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, 0, W, H); }
  }
  if (S.weather.warn > 0) { ctx.fillStyle = `rgba(30,40,60,${0.1 * (1 - S.weather.warn / 18)})`; ctx.fillRect(0, 0, W, H); }
}
function drawLabels() {
  ctx.textBaseline = 'middle';

  for (const p of PORTS) { if (!S.seen[key(p.q, p.r)]) continue; const w = h2w(p.q, p.r), s = W2S(w.x, w.y + 30); pill(s.x, s.y, p.name, 'rgba(226,91,74,.92)', '#fff'); }
  if (cam.zoom < 0.7) {
    for (const z of ZORDER) {
      if (!S.zonesSeen[z]) continue;
      const pos = { koy: [0, -3], resif: [7, 0], acik: [-7, 0], buzul: [3, -12], derin: [-3, 12] }[z];
      const w = h2w(pos[0], pos[1]), s = W2S(w.x, w.y);
      ctx.font = '600 20px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,30,45,.5)'; ctx.strokeText(ZONES[z].name, s.x, s.y); ctx.fillStyle = '#fff'; ctx.fillText(ZONES[z].name, s.x, s.y);
    }
  }

  else if (a === 'rod') { const nr = RODS[S.rod]; if (nr && spend(nr.c)) { S.rod++; toast(`${nr.n} alındı!`, 'good'); } }
  else if (a === 'bait') { const bb = b.dataset.b; if (spend(BAITS[bb].pack)) { S.bait[bb] = (S.bait[bb] || 0) + 20; toast(`20 ${BAITS[bb].n} alındı`); } }
  else if (a === 'hire') { const c = S.cands[+b.dataset.i]; if (c && S.crew.length < boatDef().crew && spend(c.fee)) { S.crew.push({ name: c.name, trait: c.trait, hat: c.hat }); S.cands.splice(+b.dataset.i, 1); toast(`${c.name} tayfaya katıldı!`, 'good'); } }
  else if (a === 'fire') { const i = +b.dataset.i; if (confirmX !== 'f' + i) { confirmX = 'f' + i; b.textContent = 'Emin misin?'; b.classList.add('warn'); return; } const c = S.crew.splice(i, 1)[0]; crewRT.splice(i, 1); toast(`${c.name} karaya çıktı. Yolun açık olsun!`); confirmX = null; }
  else if (a === 'donate') { const sp = b.dataset.s, idx = S.hold.findIndex(it => it.sp === sp); if (idx >= 0) { S.hold.splice(idx, 1); S.aqua[sp] = true; toast(`${FISH[sp].n} akvaryuma yerleşti. Ziyaretçiler bayılacak!`, 'good'); } }
  renderModal(true); renderHud(); renderBar(true);
});

$('bSpeed').addEventListener('click', () => { S.speed = S.speed >= 3 ? 1 : S.speed + 1; renderHud(); });
$('bDex').addEventListener('click', () => openModal('dex'));
$('hHold').addEventListener('click', () => openModal('market'));
$('bFar').addEventListener('click', () => { cam.follow = false; if (cam.zoom < 0.7) { cam.follow = true; animateCam(B.x, B.y, 1.3, 0.45); } else animateCam(0, 0, 0.36, 0.5); });
$('bFollow').addEventListener('click', () => { cam.follow = true; animateCam(B.x, B.y, Math.max(cam.zoom, 1.1), 0.4); });

/* ============================================================
   Loop
   ============================================================ */
let last = performance.now(), uiT = 0, saveT = 0, lastState = '';
function frame(ts) {
  const rdt = Math.min(0.05, (ts - last) / 1000); last = ts; now = ts;
  update(rdt * S.speed);
  checkGoals(rdt);
  stepCam(rdt);
  for (const w of B.wake) w.t += rdt; while (B.wake.length && B.wake[0].t > 1.4) B.wake.shift();
  for (let i = jumps.length - 1; i >= 0; i--) { jumps[i].t += rdt; if (jumps[i].t > 0.7) jumps.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += rdt; if (floaters[i].t > 1.8) floaters.splice(i, 1); }
  render();
  const st = `${!!docked()}|${B.moving}|${PM.st}|${S.weather.k}`;
  if (st !== lastState) { lastState = st; renderBar(true); }
  uiT += rdt; saveT += rdt;
  if (uiT > 0.3) { uiT = 0; renderHud(); renderBar(); renderModal(); }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function start(data) {
  if (!load(data && data.save)) newGame();
  resize(); placeBoat();
  cam.x = B.x; cam.y = B.y; cam.zoom = W < 600 ? 1.1 : 1.45;
  renderHud(); renderBar(true);
  if (S.stats.caught === 0) setTimeout(() => toast('Hoş geldin kaptan! Haritada bir yere dokun, teknen oraya gitsin.'), 700);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(ts => { last = ts; frame(ts); });
}
try { window.claude?.hot?.snapshot?.(() => ({ save: serialize() })); } catch (e) { /* optional */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
