<title>Yeşil Kasaba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --panel: rgba(27, 52, 38, 0.94);
    --panel-solid: #1f3d2c;
    --panel-2: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.11);
    --ink: #f4f3e6;
    --muted: #b3c9b4;
    --leaf: #5fcf6e;
    --leaf-deep: #36a24b;
    --sun: #ffd24a;
    --danger: #ff7a6b;
    --ground: #9cc3a4;
    --b-kagit: #3d8bd8; --b-plastik: #f2c230; --b-cam: #3fae5a; --b-metal: #8e9aa3; --b-organik: #8a5a34; --b-eatik: #d9534f;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 14px; -webkit-user-select: none; user-select: none; touch-action: none; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #map.dragging { cursor: grabbing; }
  #map.deco { cursor: copy; }

  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  #hud > * { pointer-events: auto; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 14px rgba(15, 40, 25, .3); }
  .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .coin { background: radial-gradient(circle at 35% 30%, #ffe595, #e7a72a 70%, #b97a12); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .ico svg { width: 14px; height: 14px; }
  .fuel { width: 60px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; display: inline-block; }
  .fuel i { display: block; height: 100%; border-radius: 4px; background: var(--sun); }
  .fuel.low i { background: var(--danger); }
  .fuel.green i { background: var(--leaf); }

  .clock { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px 9px; min-width: 210px; box-shadow: 0 4px 14px rgba(15, 40, 25, .3); }
  .clock .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .clock b { font-family: var(--display); font-size: 21px; line-height: 1; }
  .clock small { color: var(--muted); font-weight: 800; }
  .clock .w { margin-top: 3px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .clock .w.storm { color: var(--danger); }
  .clock .gl { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--leaf); }
  .clock .gl .fuel { flex: 1; }

  .goal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; max-width: 270px; font-size: 13px; box-shadow: 0 4px 14px rgba(15, 40, 25, .3); text-align: left; color: var(--ink); }
  .goal .lbl { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--leaf); font-weight: 900; }
  .goal .rw { color: var(--sun); font-weight: 900; white-space: nowrap; }
  .tourc .lbl { color: var(--sun); }
  .tourc .lead { color: var(--leaf); font-weight: 900; } .tourc .lose { color: var(--danger); font-weight: 900; }

  .tools { display: flex; gap: 8px; }
  .rbtn { width: 44px; height: 44px; border-radius: 12px; border: none; display: grid; place-items: center; background: var(--leaf); color: #10301b; font-weight: 900; font-size: 14px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 4px 12px rgba(15,40,25,.3); transition: transform .12s; }
  .rbtn svg { width: 19px; height: 19px; }
  .rbtn:hover { transform: translateY(-1px); }
  .rbtn:active { transform: scale(.93); }
  .rbtn.on { background: var(--sun); }

  #bar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 6; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(580px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px; box-shadow: 0 12px 34px rgba(15, 40, 25, .45); }
  .barrow { display: flex; gap: 10px; align-items: center; }
  .barrow .grow { flex: 1; min-width: 0; }
  .where { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.15; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .sortitem { display: flex; gap: 12px; align-items: center; }
  .sortitem .pic { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.08); display: grid; place-items: center; flex: none; }
  .sortitem .pic img { width: 60px; height: 60px; }
  .timer { height: 8px; border-radius: 4px; background: rgba(0,0,0,.3); overflow: hidden; margin-top: 6px; }
  .timer i { display: block; height: 100%; background: var(--leaf); border-radius: 4px; }
  .timer i.late { background: var(--sun); }
  .hearts { color: #ff6b6b; font-size: 15px; letter-spacing: 1px; }
  .streak { color: var(--sun); font-weight: 900; font-size: 13px; }
  .bins { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .bin { border: none; border-radius: 12px 12px 8px 8px; min-height: 58px; padding: 6px 2px 5px; color: #fff; font-weight: 900; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.22); position: relative; transition: transform .08s; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .bin::before { content: ""; position: absolute; top: 6px; left: 18%; right: 18%; height: 5px; border-radius: 3px; background: rgba(0,0,0,.28); }
  .bin kbd { font-family: inherit; font-size: 10px; opacity: .75; }
  .bin:active { transform: translateY(2px) scale(.97); }
  .bin.kagit { background: var(--b-kagit); } .bin.plastik { background: var(--b-plastik); color: #3a2d05; text-shadow: none; } .bin.cam { background: var(--b-cam); }
  .bin.metal { background: var(--b-metal); } .bin.organik { background: var(--b-organik); } .bin.eatik { background: var(--b-eatik); }
  .fb { font-weight: 900; font-size: 14px; }
  .fb.ok { color: var(--leaf); } .fb.bad { color: var(--danger); } .fb.gold { color: var(--sun); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 12px; border: none; background: var(--leaf); color: #10301b; font-weight: 900; font-size: 13px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .1s, filter .1s; white-space: nowrap; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px); }
  .btn.big { min-height: 50px; min-width: 150px; font-size: 16px; font-family: var(--display); border-radius: 16px; }
  .btn.sun { background: var(--sun); color: #3a2d05; }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .btn.on { background: var(--sun); color: #3a2d05; border-color: transparent; }
  .btn.warn { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
  .btn .coin { width: 14px; height: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--line); font-size: 12px; font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--sun); color: #3a2d05; font-size: 11px; font-weight: 900; }
  .mdot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

  #log { position: fixed; z-index: 4; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: 300px; }
  .li { background: rgba(20, 42, 30, .82); border-radius: 10px; padding: 5px 10px; font-size: 12px; font-weight: 700; display: flex; gap: 7px; align-items: center; animation: tin .25s ease both; }
  .li img { width: 22px; height: 22px; flex: none; }

  #modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(10, 28, 18, .55); }
  .mcard { width: min(640px, 100%); max-height: min(86vh, 780px); overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .shead h2 { margin: 0; font-family: var(--display); font-size: 25px; line-height: 1.1; flex: 1; text-wrap: balance; }
  .x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 19px; line-height: 1; flex: none; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
  .tabs { display: flex; gap: 6px; margin: 6px 0 12px; flex-wrap: wrap; }
  .tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 900; font-size: 13px; }
  .tab.on { background: var(--leaf); color: #10301b; border-color: transparent; }
  .rowline { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .rowline:first-of-type { border-top: none; }
  .rowline .grow { flex: 1; min-width: 0; }
  .rowline .t { font-weight: 900; }
  .rowline .d { font-size: 12px; color: var(--muted); line-height: 1.35; }
  img.it { width: 38px; height: 38px; flex: none; }
  .lvl { font-size: 11px; font-weight: 900; color: var(--leaf); letter-spacing: .5px; }
  .price { font-weight: 900; color: var(--sun); white-space: nowrap; }
  .note { font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.2); line-height: 1.4; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .rar0 { color: #d7e2d8; } .rar1 { color: #6fc3ff; } .rar2 { color: #c79bff; } .rar3 { color: var(--sun); }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
  .dcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .dcard img { width: 44px; height: 44px; }
  .dcard .t { font-weight: 900; font-size: 13px; }
  .dcard .d { font-size: 11px; color: var(--muted); }
  .dcard.unk { opacity: .55; }
  .zhead { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--leaf); font-weight: 900; margin: 14px 0 6px; }
  .ocard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .ocard .grow { flex: 1; min-width: 0; }
  .ocard .who { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--leaf); font-weight: 900; }
  .ocard.ready { border-color: rgba(255, 210, 74, .6); }
  .decos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .dk { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .dk .t { font-weight: 900; } .dk .d { font-size: 12px; color: var(--muted); flex: 1; }

  #toasts { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 130px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: calc(100% - 32px); }
  .toast { background: rgba(20, 42, 30, .95); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 13px; max-width: 440px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,.3); animation: tin .25s ease both; }
  .toast.good { border-color: rgba(95, 207, 110, .6); } .toast.bad { border-color: rgba(255, 122, 107, .65); } .toast.gold { border-color: var(--sun); color: var(--sun); }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    .clock { min-width: 0; }
    .goal { max-width: 220px; }
    #log { display: none; }
    #toasts { top: calc(env(safe-area-inset-top, 0px) + 160px); }
    .bins { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .bin { min-height: 46px; }
  }
  @media (max-width: 460px) { .hideS { display: none !important; } .btn.big { min-width: 120px; } }
  @media (prefers-reduced-motion: reduce) { .toast, .li { animation: none; } }
</style>

<canvas id="map" aria-label="Kasaba haritası"></canvas>

<div id="hud">

</div>

<div id="bar"></div>

/* ============================================================
   Hex math
   ============================================================ */
const SQ3 = Math.sqrt(3);
const HS = 40, TILT = 0.6, DEPTH = 9, MAPR = 14;
const key = (q, r) => q + ',' + r;
const h2w = (q, r) => ({ x: HS * SQ3 * (q + r / 2), y: HS * 1.5 * r * TILT });
function hexRound(q, r) {
  let x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return { q: rx, r: rz };
}
const w2h = (x, y) => { const yy = y / TILT; return hexRound((SQ3 / 3 * x - yy / 3) / HS, (2 / 3 * yy) / HS); };
const hd = (a, b) => { const dq = a.q - b.q, dr = a.r - b.r; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; };
const NB = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const CORNERS = [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 30); return [Math.cos(a) * HS, Math.sin(a) * HS * TILT]; });
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.floor(n).toLocaleString('tr-TR');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ============================================================
   Map (deterministic)
   ============================================================ */
const T = {};
const PORTS = [{ id: 'main', q: 0, r: 0, name: 'Geri Dönüşüm Merkezi', full: true }, { id: 'east', q: -9, r: 4, name: 'Batı Toplama Noktası', full: false }];
let SHEDS = [], CLIPS = [], LEGENDS = {};
function zoneOf(q, r) {
  const d = hd({ q, r }, { q: 0, r: 0 }), x = SQ3 * (q + r / 2), y = 1.5 * r;
  if (d <= 4) return 'mahalle';
  if (d <= 9) return x > 0 ? 'sahil' : 'park';
  return y < 0 ? 'sanayi' : 'coplik';
}
function buildMap() {
  const rng = mulberry(4242);
  for (let q = -MAPR; q <= MAPR; q++) for (let r = -MAPR; r <= MAPR; r++) {
    const d = hd({ q, r }, { q: 0, r: 0 }); if (d > MAPR) continue;
    T[key(q, r)] = { q, r, d, z: zoneOf(q, r), block: null, port: null, v: Math.floor(rng() * 3) };
  }
  const block = (q, r, b) => { const t = T[key(q, r)]; if (t) t.block = b; };
  block(-1, 0, 'houses'); block(0, -1, 'market'); block(-1, 1, 'museum'); block(-2, 1, 'workshop');
  T[key(0, 0)].port = 'main';
  block(-10, 4, 'tower'); block(-9, 3, 'houses'); T[key(-9, 4)].port = 'east';
  const near = t => NB.some(([a, b]) => { const o = T[key(t.q + a, t.r + b)]; return o && (o.block || o.port); });
  for (const t of Object.values(T)) {
    if (t.block || t.port || t.d < 2 || near(t)) continue;
    if (rng() < 0.13) t.block = { mahalle: 'house', sahil: 'hut', park: 'bigtree', sanayi: 'factory', coplik: 'junk' }[t.z];
  }
  const free = (minD, maxD, zone) => {
    for (let i = 0; i < 500; i++) {
      const q = Math.floor(rng() * (MAPR * 2 + 1)) - MAPR, r = Math.floor(rng() * (MAPR * 2 + 1)) - MAPR, t = T[key(q, r)];
      if (!t || t.block || t.port || t.d < minD || t.d > maxD || (zone && t.z !== zone)) continue;
      if (SHEDS.concat(CLIPS).some(o => o.q === q && o.r === r) || Object.values(LEGENDS).some(o => o.q === q && o.r === r)) continue;
      return t;
    }
    return null;
  };
  for (const z of ZORDER) { const t = free(z === 'mahalle' ? 3 : 6, MAPR, z); if (t) LEGENDS[z] = { q: t.q, r: t.r, z }; }
  for (let i = 0; i < 7; i++) { const t = free(3, MAPR); if (t) SHEDS.push({ id: i, q: t.q, r: t.r }); }
  const cz = ['mahalle', 'sahil', 'park', 'sanayi', 'coplik'];
  for (let i = 0; i < 5; i++) { const t = free(2, MAPR, i === 0 ? 'mahalle' : i === 1 ? 'sahil' : 'park'); if (t) CLIPS.push({ id: i, q: t.q, r: t.r, leg: cz[i] }); }
}
buildMap();
const tileAt = (q, r) => T[key(q, r)];
const portAt = (q, r) => PORTS.find(p => p.q === q && p.r === r);
const TL = Object.values(T).sort((a, b) => a.r - b.r || a.q - b.q);
const DRIVABLE = TL.filter(t => !t.block && !t.port);

/* ============================================================

const vehDef = () => VEHICLES[S.veh - 1];
const holdCap = () => vehDef().hold;
const fuelCap = () => vehDef().fuel;
const revealR = () => 2 + S.gear.drone;
const rotDur = () => [DAY, DAY * 2, DAY * 4, DAY * 8][S.gear.compost];
const dayPhase = () => (S.t % DAY) / DAY;
const hour = () => (dayPhase() * 24 + 6) % 24;
function darkness() { const h = hour(); if (h >= 20.5 || h < 4.5) return 1; if (h < 6.5) return 1 - (h - 4.5) / 2; if (h >= 18.5) return (h - 18.5) / 2; return 0; }
const isNight = () => darkness() > 0.6;

const docked = () => !B.moving && portAt(S.pos.q, S.pos.r);
const dirtAt = (q, r) => S.dirt[key(q, r)] || 0;
const isClean = t => !t.block && !t.port && !(S.dirt[key(t.q, t.r)] > 0);
const cleanCount = () => DRIVABLE.reduce((s, t) => s + (dirtAt(t.q, t.r) > 0 ? 0 : 1), 0);
const greenPct = () => cleanCount() / DRIVABLE.length;
const greenScore = () => cleanCount() + Object.values(S.deco).reduce((s, d) => s + DECOS[d].pts, 0);
function freshness(it) { return ITEMS[it.sp].m === 'organik' ? clamp(1 - (S.t - it.t) / rotDur(), 0, 1) : 1; }
function itemValue(it) {
  const f = ITEMS[it.sp];
  return f.p * (0.6 + 0.4 * it.q) * S.market[it.sp] * S.demand[it.sp] * (0.35 + 0.65 * freshness(it)) * (it.wet ? 0.6 : 1) * (it.b || 1);
}
const holdValue = () => S.hold.reduce((s, it) => s + itemValue(it), 0);
function canAfford(c) { return S.coins >= c; }
function spend(c) { if (S.coins < c) { toast('Yeterli altının yok', 'bad'); return false; } S.coins -= c; return true; }
function rollMarket() { IKEYS.forEach(k => { S.market[k] = ITEMS[k].legend ? 1 : +(0.8 + Math.random() * 0.5).toFixed(2); }); }
function rollCands() {
  S.cands = [0, 1, 2].map(() => ({ name: pick(NAMES.filter(n => !S.crew.some(c => c.name === n))), trait: pick(Object.keys(TRAITS)), hat: Math.floor(Math.random() * HATS.length), fee: Math.round(80 + S.crew.length * 60 + Math.random() * 40) }));
  S.candDay = S.day;
}
function reveal(q, r, rad) {
  for (let dq = -rad; dq <= rad; dq++) for (let dr = -rad; dr <= rad; dr++) {
    if (Math.abs(dq + dr) > rad) continue;
    const t = tileAt(q + dq, r + dr); if (!t) continue;
    if (!S.seen[key(t.q, t.r)]) {
      S.seen[key(t.q, t.r)] = 1;
      if (!S.zonesSeen[t.z]) { S.zonesSeen[t.z] = true; toast(`Yeni bölge: ${ZONES[t.z].name}. ${ZONES[t.z].desc}`, 'good'); }
    }
  }
}
function orderPool() { return IKEYS.filter(k => { const f = ITEMS[k]; return !f.legend && S.zonesSeen[f.z] && ZONES[f.z].veh <= S.veh && (f.r < 2 || S.dex[k]); }); }
function fillOrders() {
  S.orders = S.orders.filter(o => o.due >= S.day);
  let guard = 0;
  while (S.orders.length < 3 && guard++ < 20) {
    const sp = pick(orderPool()), f = ITEMS[sp];
    if (S.orders.some(o => o.sp === sp)) continue;
    const qty = f.r === 0 ? 3 + Math.floor(Math.random() * 6) : f.r === 1 ? 1 + Math.floor(Math.random() * 3) : 1;
    S.orders.push({ id: S.nextId++, who: pick(REQUESTERS), line: pick(REQ_LINES), sp, qty, reward: Math.round(f.p * qty * rnd(1.7, 2.3) + 15), due: S.day + 1 + Math.floor(Math.random() * 2) });
  }
}
function newTour() {

const B = { x: 0, y: 0, path: [], moving: false, face: 1, dust: [], tow: 0 };

function passable(t) { return t && !t.block && ZONES[t.z].veh <= S.veh; }
function findPath(from, to) {
  const start = key(from.q, from.r), goal = key(to.q, to.r);
  const prev = { [start]: null }, queue = [from];
  while (queue.length) {
    const c = queue.shift(), ck = key(c.q, c.r);
    if (ck === goal) break;
    for (const [a, b] of NB) {
      const n = tileAt(c.q + a, c.r + b); if (!n) continue;
      const nk = key(n.q, n.r);

}

  else if (a === 'wMake') { const R = RECIPES.find(x => x.id === b.dataset.r); if (R) make(R); }
  else if (a === 'wUp') { const u = b.dataset.u, base = u === 'vitrin' ? 0 : 1, c = WS_UP[u].costs[S.ws[u] - base]; if (c != null && spend(c)) { S.ws[u]++; toast(`${WS_UP[u].n} geliştirildi`, 'good'); } }
  else if (a === 'veh') { const nv = VEHICLES[S.veh]; if (nv && spend(nv.c)) { S.veh++; S.fuel = fuelCap(); toast(`${nv.n} artık senin! Şarjı dolu, yola hazır.`, 'good'); } }
  else if (a === 'gear') { const g = b.dataset.g, c = GEAR[g].costs[S.gear[g]]; if (c != null && spend(c)) { S.gear[g]++; toast(`${GEAR[g].n} ${S.gear[g] > 1 ? 'geliştirildi' : 'alındı'}`, 'good'); } }
  else if (a === 'tool') { const nt = TOOLS[S.tool]; if (nt && spend(nt.c)) { S.tool++; toast(`${nt.n} alındı!`, 'good'); } }
  else if (a === 'hire') { const c = S.cands[+b.dataset.i]; if (c && S.crew.length < vehDef().crew && spend(c.fee)) { S.crew.push({ name: c.name, trait: c.trait, hat: c.hat }); S.cands.splice(+b.dataset.i, 1); toast(`${c.name} ekibe katıldı!`, 'good'); } }
  else if (a === 'fire') { const i = +b.dataset.i; if (confirmX !== 'f' + i) { confirmX = 'f' + i; b.textContent = 'Emin misin?'; b.classList.add('warn'); return; } const c = S.crew.splice(i, 1)[0]; crewRT.splice(i, 1); toast(`${c.name} ekipten ayrıldı. Teşekkürler!`); confirmX = null; }
  else if (a === 'donate') { const sp = b.dataset.s, idx = S.hold.findIndex(it => it.sp === sp); if (idx >= 0) { S.hold.splice(idx, 1); S.museum[sp] = true; toast(`${ITEMS[sp].n} müzede sergileniyor!`, 'good'); } }
  renderModal(true); renderHud(); renderBar(true);
});
$('bSound').addEventListener('click', () => { S.sound = !S.sound; audioInit(); ambience(); renderHud(); });
$('tour').addEventListener('click', () => openModal('board'));
$('bSpeed').addEventListener('click', () => { S.speed = S.speed >= 3 ? 1 : S.speed + 1; renderHud(); });
$('bDex').addEventListener('click', () => openModal('dex'));
$('hHold').addEventListener('click', () => openModal('market'));
$('bFar').addEventListener('click', () => { cam.follow = false; if (cam.zoom < 0.7) { cam.follow = true; animateCam(B.x, B.y, 1.3, 0.45); } else animateCam(0, 0, 0.36, 0.5); });
$('bFollow').addEventListener('click', () => { cam.follow = true; animateCam(B.x, B.y, Math.max(cam.zoom, 1.1), 0.4); });

/* ============================================================
   Loop
   ============================================================ */
let last = performance.now(), uiT = 0, saveT = 0, lastState = '';
function frame(ts) {
  const rdt = Math.min(0.05, (ts - last) / 1000); last = ts; now = ts;
  update(rdt * S.speed);
  checkGoals(rdt); stepCam(rdt);
  for (const d of B.dust) d.t += rdt; while (B.dust.length && B.dust[0].t > 1.2) B.dust.shift();
  for (let i = jumps.length - 1; i >= 0; i--) { jumps[i].t += rdt; if (jumps[i].t > 0.7) jumps.splice(i, 1); }
  for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].t += rdt; if (sparks[i].t > 1.2) sparks.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += rdt; if (floaters[i].t > 1.8) floaters.splice(i, 1); }
  render();
  const st = `${!!docked()}|${B.moving}|${SM.on}|${S.weather.k}|${litterHere()}`;
  if (st !== lastState) { lastState = st; renderBar(true); ambience(); }
  uiT += rdt; saveT += rdt;
  if (uiT > 0.3) { uiT = 0; renderHud(); if (!SM.on) renderBar(); renderModal(); }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function start(data) {
  if (!load(data && data.save)) newGame();
  resize(); placeVeh();
  cam.x = B.x; cam.y = B.y; cam.zoom = W < 600 ? 1.1 : 1.45;
  renderHud(); renderBar(true);
  if (S.stats.caught === 0) setTimeout(() => toast('Hoş geldin! Gri, çöplü bir karoya dokun; araç oraya gitsin, sonra "Ayrıştır"a bas.'), 700);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(ts => { last = ts; frame(ts); });
}
try { window.claude?.hot?.snapshot?.(() => ({ save: serialize() })); } catch (e) { /* optional */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
