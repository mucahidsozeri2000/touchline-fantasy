# One-click deploy of the Touchline API + its database.
# On render.com: New → Blueprint → point it at this repo. Render reads this file,
# provisions Postgres, builds server/Dockerfile, and injects DATABASE_URL and a
# generated JWT_SECRET. The container runs `prisma migrate deploy` on start.
#
# After the first deploy, from the service's Shell. Note `sync:prod`, not
# `sync`: this image is built without dev dependencies, so it has the compiled
# CLI but no tsx and no src/.
#   npm run sync:prod doctor     # confirm the key reaches the season (2 requests)
#   npm run sync:prod catalog    # real clubs and squads   (~37 requests)
#   npm run sync:prod fixtures   # the real calendar        (1 request)
#   npm run sync:prod results    # score finished matches   (1 per fixture)
#
# Or, to play with the built-in demo league instead of real data (this one does
# need to fetch tsx, so it only works where the shell has network):
#   npx tsx prisma/seed.ts
#
# Then set CORS_ORIGINS to the origin(s) your app is served from, and build the
# app with EXPO_PUBLIC_API_BASE_URL=https://<your-service>.onrender.com/api
databases:
  - name: touchline-db
    databaseName: touchline
    user: touchline
    plan: free

services:
  - type: web
    name: touchline-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: touchline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Comma-separated list of allowed origins. Left unset here on purpose —
      # set it in the dashboard once you know where the app is served from.
      - key: CORS_ORIGINS
        sync: false
      # Football data provider. Set FOOTBALL_API_KEY in the dashboard — it is a
      # secret and must not live in this file. FOOTBALL_SEASON is the season to
      # pull; check the key covers it first with
      #   node scripts/check-football-key.mjs YOUR_KEY <season>
      - key: FOOTBALL_PROVIDER
        value: api-football
      - key: FOOTBALL_API_KEY
        sync: false
      - key: FOOTBALL_SEASON
        sync: false
      # The scheduler closes auction windows, auto-fills squads and pulls
      # results. Run it on exactly one instance: two would both tick and burn
      # through the provider's daily request quota twice as fast.
      - key: ENABLE_SCHEDULER
        value: 1
